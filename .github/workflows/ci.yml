name: verify
on: [push, pull_request]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: genvm-lint contracts/proofrail.py
      - run: pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci --prefix apps/web
      - run: npm test --prefix apps/web
      - run: npm run typecheck --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: npm audit --prefix apps/web --omit=dev --audit-level=high
      - run: node scripts/verify_live_artifact.mjs
      - run: PROOFRAIL_RELEASE_ID=hardened-v6 node scripts/verify_publishers.mjs
      - run: PROOFRAIL_RELEASE_ID=hardened-v6 node scripts/verify_live_receipts.mjs
      - run: node scripts/verify_review_evidence.mjs
